<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frappe GIS Spatial Cadastral Map Viewer</title>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #map { height: calc(100vh - 64px); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen">
  <!-- Top Bar -->
  <header class="h-16 bg-slate-950 border-b border-slate-800 px-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-white shadow-md">
        GIS
      </div>
      <h1 class="font-bold text-base tracking-wide">Frappe Spatial Cadastral Manager <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-normal">Virar Region</span></h1>
    </div>
    <div class="flex items-center gap-4 text-xs">
      <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Residential</div>
      <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> Commercial</div>
      <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> Municipal Reservation</div>
    </div>
  </header>

  <div class="relative flex-1">
    <div id="map"></div>

    <!-- Floating Info Card -->
    <div id="info-box" class="absolute top-4 right-4 bg-slate-950/90 backdrop-blur border border-slate-800 rounded-xl p-4 w-80 shadow-2xl z-[1000] hidden">
      <h3 class="font-bold text-sm text-white mb-1" id="info-title">Survey Details</h3>
      <div class="space-y-1.5 text-xs text-slate-300 mt-2">
        <p><strong>Survey No:</strong> <span id="prop-survey" class="text-emerald-400 font-mono"></span></p>
        <p><strong>Village:</strong> <span id="prop-village"></span></p>
        <p><strong>Zone:</strong> <span id="prop-zone" class="px-2 py-0.5 rounded bg-slate-800"></span></p>
        <p><strong>Reservation:</strong> <span id="prop-res"></span></p>
        <p><strong>Area:</strong> <span id="prop-area"></span> Sq.M (<span id="prop-acres"></span> Acres)</p>
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([19.4673, 72.8028], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Sample Cadastral GeoJSON
    const sampleParcels = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": { "survey_no": "104/1A", "village": "Virar East", "zone": "Residential", "reservation": "Clear", "area_sqm": 8200 },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[72.798, 19.465], [72.802, 19.465], [72.802, 19.468], [72.798, 19.468], [72.798, 19.465]]]
          }
        },
        {
          "type": "Feature",
          "properties": { "survey_no": "105/2", "village": "Virar East", "zone": "Municipal Reservation", "reservation": "Public Garden (PG-12)", "area_sqm": 12500 },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[72.803, 19.465], [72.808, 19.465], [72.808, 19.469], [72.803, 19.469], [72.803, 19.465]]]
          }
        },
        {
          "type": "Feature",
          "properties": { "survey_no": "106/4B", "village": "Virar East", "zone": "Commercial", "reservation": "Clear", "area_sqm": 6400 },
          "geometry": {
            "type": "Polygon",
            "coordinates": [[[72.799, 19.469], [72.804, 19.469], [72.804, 19.472], [72.799, 19.472], [72.799, 19.469]]]
          }
        }
      ]
    };

    function getStyle(feature) {
      if (feature.properties.zone === "Municipal Reservation") {
        return { color: "#f43f5e", fillColor: "#f43f5e", fillOpacity: 0.45, weight: 2 };
      } else if (feature.properties.zone === "Commercial") {
        return { color: "#f59e0b", fillColor: "#f59e0b", fillOpacity: 0.35, weight: 2 };
      }
      return { color: "#10b981", fillColor: "#10b981", fillOpacity: 0.35, weight: 2 };
    }

    L.geoJSON(sampleParcels, {
      style: getStyle,
      onEachFeature: function(feature, layer) {
        layer.on('click', function(e) {
          const props = feature.properties;
          document.getElementById('info-box').classList.remove('hidden');
          document.getElementById('prop-survey').innerText = props.survey_no;
          document.getElementById('prop-village').innerText = props.village;
          document.getElementById('prop-zone').innerText = props.zone;
          document.getElementById('prop-res').innerText = props.reservation;
          document.getElementById('prop-area').innerText = props.area_sqm.toLocaleString();
          document.getElementById('prop-acres').innerText = (props.area_sqm / 4046.86).toFixed(3);
        });
      }
    }).addTo(map);
  </script>
</body>
</html>
